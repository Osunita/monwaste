name: monwaste
description: "Monwaste — Nunca olvides cuánto dinero se va cada mes."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Database
  drift: ^2.25.0
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Notifications (wired, not actively used until Increment 5)
  flutter_local_notifications: ^18.0.1

  # Color picker
  flutter_colorpicker: ^1.1.0

  # Formatting
  intl: ^0.20.2

  # Glance widget (Android home screen)
  glance_widget: ^1.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  drift_dev: ^2.25.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.3

  # Linting
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
